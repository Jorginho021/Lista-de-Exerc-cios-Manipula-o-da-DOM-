<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Interações com JavaScript</title>
</head>
<body>

  
  <button id="botaoClique">Clique aqui</button>

  <br><br>


  <div id="caixa">Conteúdo original</div>
  <button id="botaoMudarConteudo">Mudar conteúdo</button>

  <br><br>


  <p id="paragrafo">Este é um parágrafo.</p>
  <button id="botaoEstiloParagrafo">Estilizar parágrafo</button>

  
  <script>
   
    document.getElementById("botaoClique").addEventListener("click", function () {
      this.textContent = "Clicado!";
    });


    document.getElementById("botaoMudarConteudo").addEventListener("click", function () {
      document.getElementById("caixa").innerHTML = "<strong>Conteúdo em negrito</strong>";
    });

    document.getElementById("botaoEstiloParagrafo").addEventListener("click", function () {
      const p = document.getElementById("paragrafo");
      p.style.color = "green";
      p.style.fontSize = "20px";
      p.style.backgroundColor = "yellow";
    });
  </script>

</body>
</html>
